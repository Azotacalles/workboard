name: workboard

on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: ci_postgres
          POSTGRES_PASSWORD: ci_postgres
          POSTGRES_DB: ci_workboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: "ci-only-workboard-key-not-for-production"
      DATABASE_URL: postgres://ci_postgres:ci_postgres@localhost:5432/ci_workboard
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "True"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip 
          python -m pip install -r requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python -m pytest
        working-directory: backend


